[package]
name = "pdfcraft-office"
description = "Convert a PDF to Word (.docx), PowerPoint (.pptx), HTML or RTF: a library other apps can open PDFs with"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-edit = { workspace = true }
pdfcraft-create = { workspace = true }
pdfcraft-export = { workspace = true }
thiserror = { workspace = true }
# Text recognition for scanned pages: off by default (the models are separate files, and wasm
# builds leave it out).
pdfcraft-ocr = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[features]
ocr = ["dep:pdfcraft-ocr", "dep:image"]

[dev-dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-testkit = { workspace = true }
flate2 = { workspace = true }
